    <style>
        .shimmer td{
          border: 1px solid #ddd;
          padding: 18px;
           background: linear-gradient(90deg, #f0f0f0 25%, #e7e7e7 50%, #f0f0f0 75%);
          background-size: 200% 100%;
          animation: shimmer 2s infinite;
        }
        
        @keyframes shimmer {
          0% {
            background-position: -200% 0;
          }
          100% {
            background-position: 200% 0;
          }
        }

        /* Ensure preloader is hidden after page load */
        #preloader {
          display: none;
        }
        
        body.loaded #preloader {
          display: none !important;
        }
    </style>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
<!-- Begin page -->
<div id="layout-wrapper">
  <div id="root"></div>
</div>
<!-- END layout-wrapper -->

<!--start back-to-top-->
<button onclick="topFunction()" class="btn btn-danger btn-icon" id="back-to-top" style="display: none;">
  <i class="ri-arrow-up-line"></i>
</button>
<!--end back-to-top-->

<!--preloader-->
<div id="preloader">
  <div id="status">
      <div class="spinner-border text-primary avatar-sm" role="status">
          <span class="visually-hidden">Loading...</span>
      </div>
  </div>
</div>

<!-- JAVASCRIPT - Load after DOM is ready -->
<script>
  // Hide preloader when page loads
  window.addEventListener('load', function() {
    document.body.classList.add('loaded');
    var preloader = document.getElementById('preloader');
    if (preloader) {
      preloader.style.display = 'none';
    }
  });
</script>
<script src="%PUBLIC_URL%/assets/js/vendor.js"></script>
<script src="%PUBLIC_URL%/assets/js/app.js" defer></script>
<script>
  // Prevent template JS from interfering with React-managed DOM
  // Wrap removeChild to handle React's DOM management gracefully
  (function() {
    const originalRemoveChild = Node.prototype.removeChild;
    Node.prototype.removeChild = function(child) {
      try {
        return originalRemoveChild.call(this, child);
      } catch (e) {
        // If node is not a child (React already removed it), return the child
        if (e.name === 'NotFoundError' || e.message.includes('not a child')) {
          return child;
        }
        throw e;
      }
    };
  })();
</script>

</body>

</html>
